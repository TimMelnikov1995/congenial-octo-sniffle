<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#101418" />
    <title>Untitled Platformer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #101418;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Force-landscape on portrait touch devices: rotate the whole app
         container by -90deg and swap its logical width/height so Pixi (and
         the touch-controls overlay inside #app) still see a normal landscape
         viewport. The user just turns the phone — when the device flips to
         landscape this media query stops matching and the page returns to
         its untransformed layout. */
      @media (orientation: portrait) and (hover: none) {
        #app {
          inset: auto;
          top: 50%;
          left: 50%;
          width: 100vh;
          height: 100vw;
          transform: translate(-50%, -50%) rotate(-90deg);
          transform-origin: center center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-status" style="position:absolute;left:8px;top:8px;z-index:9998;color:#9aa;font:12px/1.3 monospace;pointer-events:none;background:rgba(0,0,0,0.4);padding:4px 6px;border-radius:4px;">
        boot: html parsed, waiting for js&hellip;
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
